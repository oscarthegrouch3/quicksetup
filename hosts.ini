# QuickSetup Ansible Inventory

# For provision target: running directly on the VM / local machine
[local]
localhost ansible_connection=local

# For remote target: provisioning a remote VM over SSH
[remote_vms]
# 192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
