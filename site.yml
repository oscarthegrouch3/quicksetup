---
- name: QuickSetup - Provision VM Environment
  hosts: all
  become: true
  roles:
    - role: common
    - role: dev_tools
      when: install_dev_tools | default(true)
    - role: desktop_apps
      when: install_desktop_apps | default(true)
    - role: shell_tools
      when: install_shell_tools | default(true)
